id = "wayfinder"
name = "Wayfinder"

[[options]]
id = "pathfinding"
label = "Pathfinding"
type = "checkbox"
default = true
description = "Infantry and vehicles route around obstacles and hazards instead of walking straight"
aliases = ["pathfindingEnabled"]

[[options]]
id = "player_soldiers"
label = "Pathfinding For Your Soldiers"
type = "checkbox"
default = true
description = "Your soldiers route around obstacles and hazards too. Off: they walk straight to where you send them, as in the game; the enemy and allied AI still use pathfinding"
aliases = ["playerPathfindingEnabled"]

[[options]]
id = "infantry_collision"
label = "Infantry Collision"
type = "checkbox"
default = true
description = "Solid objects stop soldiers, who walk round them. Off: soldiers can cross anything, as in the game; paths still prefer to go round"
aliases = ["infantryCollisionEnabled"]

[[options]]
id = "path_through_buildings"
label = "Path Through Buildings"
type = "checkbox"
default = true
description = "Paths may lead through a building when walking round it is far longer. Off: soldiers only enter the building they start in or are sent to"
aliases = ["pathThroughBuildingsEnabled"]

[[options]]
id = "fine_tuned_collisions"
label = "Fine Tuned Collisions"
type = "submenu"
description = "A switch for each kind of object: on, it stops soldiers; off, they can cross it. Vehicles go round all of them"

[[options]]
id = "collide_dragon_teeth"
label = "Dragon's Teeth"
type = "checkbox"
default = true
description = "Concrete dragon's teeth"
submenu = "fine_tuned_collisions"
aliases = ["collideDragonTeethEnabled"]

[[options]]
id = "collide_hedgehogs"
label = "Hedgehogs And Obstacles"
type = "checkbox"
default = true
description = "Steel hedgehogs and obstacle frames"
submenu = "fine_tuned_collisions"
aliases = ["collideHedgehogsEnabled"]

[[options]]
id = "collide_barricades"
label = "Barricades"
type = "checkbox"
default = true
description = "Barricades, including cart barricades"
submenu = "fine_tuned_collisions"
aliases = ["collideBarricadesEnabled"]

[[options]]
id = "collide_low_walls"
label = "Low Walls"
type = "checkbox"
default = false
description = "Breastworks, wall sections and barrel walls. Off by default: maps lay them in lines as cover to climb over"
submenu = "fine_tuned_collisions"
aliases = ["collideLowWallsEnabled"]

[[options]]
id = "collide_fences"
label = "Fences"
type = "checkbox"
default = false
description = "Fences. Off by default: maps lay them in lines as cover to climb over"
submenu = "fine_tuned_collisions"
aliases = ["collideFencesEnabled"]

[[options]]
id = "collide_palisades"
label = "Palisades"
type = "checkbox"
default = true
description = "Wooden palisades"
submenu = "fine_tuned_collisions"
aliases = ["collidePalisadesEnabled"]

[[options]]
id = "collide_vehicles"
label = "Vehicles And Wagons"
type = "checkbox"
default = true
description = "Cars, trucks, tractors, tankers, carts, wagons and armoured trains"
submenu = "fine_tuned_collisions"
aliases = ["collideVehiclesEnabled"]

[[options]]
id = "collide_cannons"
label = "Cannons"
type = "checkbox"
default = true
description = "Cannons"
submenu = "fine_tuned_collisions"
aliases = ["collideCannonsEnabled"]

[[options]]
id = "collide_radar"
label = "Radar Bases"
type = "checkbox"
default = true
description = "Radar bases"
submenu = "fine_tuned_collisions"
aliases = ["collideRadarEnabled"]

[[options]]
id = "collide_stacks"
label = "Stacks And Piles"
type = "checkbox"
default = true
description = "Brick stacks, wood piles and plank piles"
submenu = "fine_tuned_collisions"
aliases = ["collideStacksEnabled"]

[[options]]
id = "collide_hay"
label = "Hay"
type = "checkbox"
default = true
description = "Haystacks and hay bales"
submenu = "fine_tuned_collisions"
aliases = ["collideHayEnabled"]

[[options]]
id = "collide_crates"
label = "Crates And Barrels"
type = "checkbox"
default = true
description = "Crates, barrels and wheelbarrows"
submenu = "fine_tuned_collisions"
aliases = ["collideCratesEnabled"]

[[options]]
id = "collide_tombs"
label = "Tombs"
type = "checkbox"
default = true
description = "Tombs and gravestones"
submenu = "fine_tuned_collisions"
aliases = ["collideTombsEnabled"]

[[options]]
id = "safe_destination"
label = "Safer Destinations"
type = "checkbox"
default = true
description = "Moves an order that lands on a hazard or inside an obstacle to the nearest safe spot"
aliases = ["safeDestinationEnabled"]

[[options]]
id = "async_paths"
label = "Solve Paths In The Background"
type = "checkbox"
default = true
description = "Paths are solved on a second thread, so large squads do not stall the game"
aliases = ["asyncPathsEnabled"]

[[keybinds]]
id = "wayfinder_direct_move"
name = "Direct Move (hold while ordering)"
category = "Orders"
default = "x"
tab = "Wayfinder"
description = "Hold while giving a move order: the soldiers walk straight to the spot, through wire or anything else, with no detour. A later order without the key uses pathfinding again"

[[keybinds]]
id = "navgrid_overlay"
name = "Toggle Navigation Grid Overlay"
category = "Diagnostics"
default = "f9"
modifiers = ["shift"]
tab = "Wayfinder"
description = "Shows the navigation grid and the paths in use"
on_trigger = "Wayfinder.toggleOverlay"
