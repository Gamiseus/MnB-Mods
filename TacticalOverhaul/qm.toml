# 7. AI.lua: Prepend combat reaction engine
[[patches]]
[patches.pattern]
target = "includes/ai.lua"
pattern = "function infantryUpdate(dt)"
position = "before"
payload = '''
local COMBAT_CALLOUTS = {
  "Taking fire! Finding cover!",
  "Ambush! Hit the dirt!",
  "Enemy contact! Take cover!",
  "Under heavy fire! Moving to cover!"
}

local CONTACT_CALLOUTS = {
  "Hostiles spotted! Get down!",
  "Germans sighted! Take cover!",
  "Enemy contact front!",
  "Movement ahead! Watch your fire!"
}

local SECURE_CALLOUTS = {
  "Threat eliminated! Moving out!",
  "All clear! Resuming move!",
  "Area secure! Moving out!",
  "Hostiles down! Keep moving!"
}

local function findCoverWithinRadius(dude, maxRadius, threat)
  if not player then return nil, nil, false end
  maxRadius = maxRadius or 160
  local bestScore = 99999
  local bestX, bestY = nil, nil

  local px, py = dude.x, dude.y
  local curThreatDist = threat and distanceCheck(px, py, threat.x, threat.y) or 99999

  -- 1. Check if current movement order destination is ALREADY in/near cover
  if dude.targetx and dude.targety then
    local distToOrder = distanceCheck(px, py, dude.targetx, dude.targety)
    if distToOrder <= 90 then
      local destCover = false
      if player.groundType then
        for u = 1, #player.groundType do
          local gt = player.groundType[u]
          if gt and (gt.cover or 0) > 0 and (gt.width or 0) > 0 and (gt.length or 0) > 0 then
            if dude.targetx >= gt.x and dude.targetx <= gt.x + gt.width and
               dude.targety >= gt.y and dude.targety <= gt.y + gt.length then
              destCover = true
              break
            end
          end
        end
      end
      if not destCover and player.forest then
        for u = 1, #player.forest do
          local f = player.forest[u]
          if f and distanceCheck(dude.targetx, dude.targety, f.x, f.y) <= (f.radius or 30) then
            destCover = true
            break
          end
        end
      end
      if destCover then
        return dude.targetx, dude.targety, true
      end
    end
  end

  -- 2. Evaluate groundType rectangles (trenches, sandbags, craters, walls)
  if player.groundType then
    for u = 1, #player.groundType do
      local gt = player.groundType[u]
      if gt and (gt.cover or 0) > 0 and (gt.width or 0) > 0 and (gt.length or 0) > 0 then
        local minX = gt.x
        local maxX = gt.x + gt.width
        local minY = gt.y
        local maxY = gt.y + gt.length

        local nearX = math.max(minX, math.min(px, maxX))
        local nearY = math.max(minY, math.min(py, maxY))
        local d = distanceCheck(px, py, nearX, nearY)

        if d <= maxRadius then
          local candX = math.max(minX + 8, math.min(nearX, maxX - 8))
          local candY = math.max(minY + 8, math.min(nearY, maxY - 8))

          local compromised = false
          if player.deployedTroops then
            for o = 1, #player.deployedTroops do
              local tro = player.deployedTroops[o]
              if tro and tro.faction == "axis" and (tro.health or 0) > 10 and distanceCheck(candX, candY, tro.x, tro.y) < 140 then
                compromised = true
                break
              end
            end
          end

          local crowd = 0
          if not compromised and player.deployedTroops then
            for o = 1, #player.deployedTroops do
              local tro = player.deployedTroops[o]
              if tro and tro.faction == dude.faction and tro.id ~= dude.id and distanceCheck(candX, candY, tro.x, tro.y) < 50 then
                crowd = crowd + 1
              end
            end
          end

          if not compromised and crowd <= 2 and not fireNearby(candX, candY) then
            local score = d
            if threat and threat.x and threat.y then
              local candThreatDist = distanceCheck(candX, candY, threat.x, threat.y)
              if candThreatDist < curThreatDist - 30 then
                score = score + 160
              elseif candThreatDist >= curThreatDist then
                score = score - 25
              end

              local canShoot = los2 and los2({x = candX, y = candY}, threat)
              if canShoot then
                score = score - 60
              else
                score = score + 45
              end
            end

            score = score - (gt.cover or 0) * 0.4
            if score < bestScore then
              bestScore = score
              bestX = candX
              bestY = candY
            end
          end
        end
      end
    end
  end

  -- 3. Evaluate trees (forest)
  if player.forest then
    for u = 1, #player.forest do
      local f = player.forest[u]
      if f then
        local d = distanceCheck(px, py, f.x, f.y)
        if d <= maxRadius and d > 20 then
          local candX = f.x
          local candY = f.y

          local compromised = false
          if player.deployedTroops then
            for o = 1, #player.deployedTroops do
              local tro = player.deployedTroops[o]
              if tro and tro.faction == "axis" and (tro.health or 0) > 10 and distanceCheck(candX, candY, tro.x, tro.y) < 140 then
                compromised = true
                break
              end
            end
          end

          if not compromised and not fireNearby(candX, candY) then
            local score = d + 20
            if threat and threat.x and threat.y then
              local candThreatDist = distanceCheck(candX, candY, threat.x, threat.y)
              if candThreatDist < curThreatDist - 30 then
                score = score + 160
              end
              local canShoot = los2 and los2({x = candX, y = candY}, threat)
              if canShoot then
                score = score - 40
              else
                score = score + 30
              end
            end

            if score < bestScore then
              bestScore = score
              bestX = candX
              bestY = candY
            end
          end
        end
      end
    end
  end

  return bestX, bestY, false
end

local function getThreatInfo(dude)
  local nearestVisibleEnemy = nil
  local nearestVisibleDist = 99999
  local visibleThreatCount = 0

  local nearestProximityEnemy = nil
  local nearestProximityDist = 99999
  local proximityCount = 0

  local hasDirectThreat = false
  if not player then return nil, 99999, 0, nil, 99999, 0, false end

  if player.deployedTroops then
    for o = 1, #player.deployedTroops do
      local enemy = player.deployedTroops[o]
      if enemy and enemy.faction == "axis" and (enemy.health or 0) > 10 and (enemy.dead or 0) == 0 then
        local d = distanceCheck2(dude, enemy)
        local isStealthed = (hasBuffByTag("stealth", enemy) or hasBuffByTag("camo", enemy)) and (enemy.flagged or 0) <= 0
        if not isStealthed then
          if d <= 520 then
            proximityCount = proximityCount + 1
            if d < nearestProximityDist then
              nearestProximityDist = d
              nearestProximityEnemy = enemy
            end
          end

          if d <= 600 then
            local hasLOS = los2 and los2(dude, enemy)
            if hasLOS then
              visibleThreatCount = visibleThreatCount + 1
              if d < nearestVisibleDist then
                nearestVisibleDist = d
                nearestVisibleEnemy = enemy
              end
              if d <= 420 or (enemy.aim and enemy.aim > 0) or (enemy.target == dude.id) or (enemy.flagged and enemy.flagged > 0) then
                hasDirectThreat = true
              end
            end
          end
        end
      end
    end
  end

  if player.deployedVehicles then
    for o = 1, #player.deployedVehicles do
      local veh = player.deployedVehicles[o]
      if veh and veh.faction == "axis" and (veh.dead or 0) == 0 and (veh.health or 0) > 10 then
        local d = distanceCheck2(dude, veh)
        if d <= 650 then
          proximityCount = proximityCount + 1
          if d < nearestProximityDist then
            nearestProximityDist = d
            nearestProximityEnemy = veh
          end
          local hasLOS = los2 and los2(dude, veh)
          if hasLOS then
            visibleThreatCount = visibleThreatCount + 1
            if d < nearestVisibleDist then
              nearestVisibleDist = d
              nearestVisibleEnemy = veh
            end
            hasDirectThreat = true
          end
        end
      end
    end
  end

  return nearestVisibleEnemy, nearestVisibleDist, visibleThreatCount, nearestProximityEnemy, nearestProximityDist, proximityCount, hasDirectThreat
end

local function checkCombatInterruption(dude, dt)
  if not dude or dude.faction ~= "allied" or (dude.dead or 0) == 1 or (dude.health or 0) <= 0 then
    return
  end

  if (dude._combatHysteresisTimer or 0) > 0 then
    dude._combatHysteresisTimer = dude._combatHysteresisTimer - dt
    if dude._combatHysteresisTimer < 0 then dude._combatHysteresisTimer = 0 end
  end

  if (dude.confused or 0) > 0 or (dude.retreating or 0) > 0 or (dude.pinned or 0) > 0 or (dude.onFire or 0) > 0 then
    return
  end

  local isMoving = (dude.targetx and dude.targety and (math.abs(dude.x - dude.targetx) > 12 or math.abs(dude.y - dude.targety) > 12))
  local visEnemy, visDist, visCount, proxEnemy, proxDist, proxCount, hasDirectThreat = getThreatInfo(dude)
  local primaryThreat = visEnemy or proxEnemy
  local dangerVal = dude.danger or 0
  local takingFire = (dangerVal >= 30) or hasDirectThreat
  local enemySighted = (visCount > 0 and visEnemy ~= nil)
  local isVeteran = ((dude.kills or 0) >= 1) or ((dude.xp or 0) >= 15)

  if dude._inCombatReaction then
    -- Sub-state 1A: Veteran Shoot-First Retaliation Burst
    if dude._combatRetaliating then
      dude.temporaryStop = 2.0
      dude.targetx = dude.x
      dude.targety = dude.y

      if primaryThreat then
        dude.targetPointer = primaryThreat.id
        dude.targetDistance = visDist
        dude.aim = 1
        if primaryThreat.y and primaryThreat.x then
          dude.rotation = math.atan2(dude.y - primaryThreat.y, dude.x - primaryThreat.x) + 1.5707
        end
      end

      dude._retaliationTimer = (dude._retaliationTimer or 2.0) - dt
      if dude._retaliationTimer <= 0 then
        dude._combatRetaliating = nil
        dude._retaliationDone = true

        local threatDead = not primaryThreat or (primaryThreat.dead and primaryThreat.dead == 1) or (primaryThreat.health and primaryThreat.health <= 0)
        if threatDead and proxCount == 0 then
          dude._inCombatReaction = nil
          dude._combatThreatClearTimer = nil
          dude._sprintingToCover = nil
          dude.temporaryStop = 0
          dude._combatHysteresisTimer = 4.0

          if SECURE_CALLOUTS and #SECURE_CALLOUTS > 0 then
            floatyText(dude, SECURE_CALLOUTS[randNbr(#SECURE_CALLOUTS)])
          end

          if dude._savedOrderX and dude._savedOrderY then
            dude.targetx = dude._savedOrderX
            dude.targety = dude._savedOrderY
            dude._savedOrderX = nil
            dude._savedOrderY = nil
            if pathfinding and pathfinding.requestPathAsync then
              pathfinding.requestPathAsync(dude, dude.x, dude.y, dude.targetx, dude.targety)
            end
          end
          return
        end

        local inCoverNow = (underCover and underCover(dude)) or ((dude.cover or 0) > 0)
        if not inCoverNow then
          local cx, cy = findCoverWithinRadius(dude, 160, primaryThreat)
          local standAndFight = false
          if not cx or not cy then
            standAndFight = true
          elseif randNbr(100) < 50 then
            standAndFight = true
          end

          if standAndFight then
            dude._sprintingToCover = nil
            dude.temporaryStop = 2.0
            dude.targetx = dude.x
            dude.targety = dude.y
            dude.pathQueue = nil
            dude.stance = 2
            floatyText(dude, "Hold the line! Engaging!")
          else
            dude._sprintingToCover = true
            dude.temporaryStop = 0
            dude.targetx = cx
            dude.targety = cy
            dude.stance = 1
            if pathfinding and pathfinding.requestPathAsync then
              pathfinding.requestPathAsync(dude, dude.x, dude.y, cx, cy)
            end
            floatyText(dude, "Moving to better cover!")
          end
        end
      end
      return
    end

    -- Sub-state 1B: Sprinting into cover
    if dude._sprintingToCover then
      local distToCover = (dude.targetx and dude.targety) and distanceCheck(dude.x, dude.y, dude.targetx, dude.targety) or 9999
      local inCoverNow = (underCover and underCover(dude)) or ((dude.cover or 0) > 0)
      if distToCover < 24 or inCoverNow then
        dude._sprintingToCover = nil
        dude.temporaryStop = 2.0
        dude.pathQueue = nil
        if visEnemy then
          dude.targetPointer = visEnemy.id
          dude.targetDistance = visDist
          dude.aim = 1
          if visEnemy.y and visEnemy.x then
            dude.rotation = math.atan2(dude.y - visEnemy.y, dude.x - visEnemy.x) + 1.5707
          end
        elseif proxEnemy and proxEnemy.y and proxEnemy.x then
          dude.rotation = math.atan2(dude.y - proxEnemy.y, dude.x - proxEnemy.x) + 1.5707
        end
      end
      return
    end

    -- Sub-state 1C: Halted in combat reaction
    dude.temporaryStop = 2.0
    if visEnemy then
      dude.targetPointer = visEnemy.id
      dude.targetDistance = visDist
      dude.aim = 1
      if visEnemy.y and visEnemy.x then
        dude.rotation = math.atan2(dude.y - visEnemy.y, dude.x - visEnemy.x) + 1.5707
      end
    elseif proxEnemy and proxEnemy.y and proxEnemy.x then
      dude.rotation = math.atan2(dude.y - proxEnemy.y, dude.x - proxEnemy.x) + 1.5707
    end

    if proxCount > 0 or takingFire or dangerVal >= 20 then
      dude._combatThreatClearTimer = nil
    else
      if not dude._combatThreatClearTimer then
        dude._combatThreatClearTimer = 4.0
      else
        dude._combatThreatClearTimer = dude._combatThreatClearTimer - dt
        if dude._combatThreatClearTimer <= 0 then
          dude._inCombatReaction = nil
          dude._combatThreatClearTimer = nil
          dude._sprintingToCover = nil
          dude._combatRetaliating = nil
          dude._retaliationDone = nil
          dude.temporaryStop = 0
          dude._combatHysteresisTimer = 4.0

          if SECURE_CALLOUTS and #SECURE_CALLOUTS > 0 then
            floatyText(dude, SECURE_CALLOUTS[randNbr(#SECURE_CALLOUTS)])
          end

          if dude._savedOrderX and dude._savedOrderY then
            dude.targetx = dude._savedOrderX
            dude.targety = dude._savedOrderY
            dude._savedOrderX = nil
            dude._savedOrderY = nil
            if pathfinding and pathfinding.requestPathAsync then
              pathfinding.requestPathAsync(dude, dude.x, dude.y, dude.targetx, dude.targety)
            end
          end
          return
        end
      end
    end
    return
  end

  -- STATE 2: Not in Combat Reaction — Check for Interruption
  if isMoving and (takingFire or enemySighted) then
    if (dude._combatHysteresisTimer or 0) > 0 and not takingFire then
      return
    end

    dude._savedOrderX = dude._savedOrderX or dude.targetx
    dude._savedOrderY = dude._savedOrderY or dude.targety
    dude._inCombatReaction = true
    dude._combatThreatClearTimer = nil

    local inCoverNow = (underCover and underCover(dude)) or ((dude.cover or 0) > 0)

    -- VETERANCY CHECK: Shoot first before seeking cover
    if isVeteran and not dude._retaliationDone and primaryThreat then
      dude._combatRetaliating = true
      dude._retaliationTimer = 1.6 + randNbr(8) / 10
      dude._retaliationTargetId = primaryThreat.id
      dude.temporaryStop = 2.0
      dude.targetx = dude.x
      dude.targety = dude.y
      dude.pathQueue = nil
      dude._pfGoalX = nil
      dude._pfGoalY = nil

      if not inCoverNow then
        dude.stance = takingFire and 2 or 1
      end

      dude.targetPointer = primaryThreat.id
      dude.targetDistance = visDist
      dude.aim = 1
      if primaryThreat.y and primaryThreat.x then
        dude.rotation = math.atan2(dude.y - primaryThreat.y, dude.x - primaryThreat.x) + 1.5707
      end

      local retCallouts = {
        "Returning fire! Cover me!",
        "Enemy sighted! Opening fire!",
        "Engaging hostiles!",
        "Contact front! Firing!"
      }
      floatyText(dude, retCallouts[randNbr(#retCallouts)])
      return
    end

    -- Tactical decision: seek cover vs stand and fight
    local cx, cy = nil, nil
    if not inCoverNow then
      cx, cy = findCoverWithinRadius(dude, 160, primaryThreat)
    end

    local standAndFight = false
    if not cx or not cy then
      standAndFight = true
    else
      local role = dude.spec or ""
      local isGunner = (role == "gunner") or (dude.bipod and dude.bipod == 1)
      local isSniper = (role == "sniper")
      if isGunner or isSniper then
        if randNbr(100) < 70 then standAndFight = true end
      elseif visDist and visDist < 180 then
        if randNbr(100) < 60 then standAndFight = true end
      elseif randNbr(100) < 35 then
        standAndFight = true
      end
    end

    if not standAndFight and cx and cy then
      dude._sprintingToCover = true
      dude.temporaryStop = 0
      dude.targetx = cx
      dude.targety = cy
      dude.stance = 1
      if pathfinding and pathfinding.requestPathAsync then
        pathfinding.requestPathAsync(dude, dude.x, dude.y, cx, cy)
      end
      floatyText(dude, COMBAT_CALLOUTS[randNbr(#COMBAT_CALLOUTS)])
    else
      dude._sprintingToCover = nil
      dude.temporaryStop = 2.0
      dude.targetx = dude.x
      dude.targety = dude.y
      dude.pathQueue = nil
      dude._pfGoalX = nil
      dude._pfGoalY = nil

      if not inCoverNow then
        dude.stance = 2
      end

      if primaryThreat then
        dude.targetPointer = primaryThreat.id
        dude.targetDistance = visDist
        dude.aim = 1
        if primaryThreat.y and primaryThreat.x then
          dude.rotation = math.atan2(dude.y - primaryThreat.y, dude.x - primaryThreat.x) + 1.5707
        end
      end

      if takingFire then
        floatyText(dude, "Taking fire! Return fire!")
      else
        floatyText(dude, CONTACT_CALLOUTS[randNbr(#CONTACT_CALLOUTS)])
      end
    end

    if spamTimer <= 0 then
      spamTimer = 2
      local sfx = _G["lineStop" .. randNbr(14)]
      if sfx then
        local clone = sfx:clone()
        clone:setVolume(stepScale(dude) / 2.0)
        clone:play()
      end
    end
  end
end
