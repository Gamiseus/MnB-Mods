[manifest]
version = "1.0.0"
priority = 20

# 1. Register smart move module
[[patches]]
[patches.module]
source = "smart_move.lua"
before = "main.lua"
name = "includes/smart_move"

# 2. Main.lua: Require smart_move and initialize squad limit & smart move settings
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = '''
smart_move = require "includes/smart_move"

modSettings = modSettings or {}
if modSettings.squadLimitEnabled == nil then modSettings.squadLimitEnabled = 1 end
if modSettings.squadLimitThreshold == nil then modSettings.squadLimitThreshold = 6 end
if modSettings.smartMoveEnabled == nil then modSettings.smartMoveEnabled = 1 end

local _origLoadModSettings = loadModSettings
function loadModSettings()
  if _origLoadModSettings then _origLoadModSettings() end
  if love and love.filesystem and love.filesystem.getInfo and love.filesystem.getInfo("mod_settings.lua") then
    local ok, loaded = pcall(love.filesystem.load, "mod_settings.lua")
    if ok and type(loaded) == "function" then
      local ok2, data = pcall(loaded)
      if ok2 and type(data) == "table" then
        if data.squadLimitEnabled ~= nil then modSettings.squadLimitEnabled = data.squadLimitEnabled end
        if data.squadLimitThreshold ~= nil then modSettings.squadLimitThreshold = data.squadLimitThreshold end
        if data.smartMoveEnabled ~= nil then modSettings.smartMoveEnabled = data.smartMoveEnabled end
      end
    end
  end
  if player then
    player.option_squadLimitEnabled = modSettings.squadLimitEnabled
    player.option_squadLimitThreshold = modSettings.squadLimitThreshold
    player.option_smartMoveEnabled = modSettings.smartMoveEnabled
  end
end

local _origSaveModSettings = saveModSettings
function saveModSettings()
  if love and love.filesystem then
    local ser = require "includes/ser"
    local diskSettings = {}
    if love.filesystem.getInfo and love.filesystem.getInfo("mod_settings.lua") then
      local ok, loaded = pcall(love.filesystem.load, "mod_settings.lua")
      if ok and type(loaded) == "function" then
        local ok2, data = pcall(loaded)
        if ok2 and type(data) == "table" then
          for k, v in pairs(data) do diskSettings[k] = v end
        end
      end
    end
    for k, v in pairs(modSettings) do diskSettings[k] = v end
    love.filesystem.write("mod_settings.lua", ser(diskSettings))
  end
  if player then
    player.option_squadLimitEnabled = modSettings.squadLimitEnabled
    player.option_squadLimitThreshold = modSettings.squadLimitThreshold
    player.option_smartMoveEnabled = modSettings.smartMoveEnabled
  end
  if _origSaveModSettings and _origSaveModSettings ~= saveModSettings then
    _origSaveModSettings()
  end
end
