name: Publish Release

on:
  release:
    types:
      [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Mod Archives
        # One zip per mod, each holding a single folder named after the mod, plus
        # qm-release-index.json. The same script builds the zips locally.
        run: python3 tools/package_mods.py --out dist --index

      - name: Publish or Update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Uploading/overwriting assets..."
            gh release upload "${{ github.ref_name }}" dist/*.zip dist/qm-release-index.json --clobber
          else
            echo "Creating new release ${{ github.ref_name }}..."
            gh release create "${{ github.ref_name }}" dist/*.zip dist/qm-release-index.json \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
