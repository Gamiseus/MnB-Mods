# checkObstruction counts the soldiers of the same faction within 20 px and names the first.
# With the option on the game's loop below runs zero times.
[[patches]]
[patches.pattern]
id = "perfkit:near_check_obstruction"
name = "checkObstruction: count from the per-frame sorting"
target = "includes/urb_engine.lua"
pattern = '''
for i=1, #player.deployedTroops, 1 do
  if(player.deployedTroops[i].id ~= soldier.id and player.deployedTroops[i].faction == soldier.faction and player.deployedTroops[i].health > 10) then
'''
position = "at"
times = 1
payload = '''
if PerfKit.Near.on then
  local __pk_first
  obstructors, __pk_first = PerfKit.Near.countOwn(soldier, 20)
  if __pk_first then obstructor = __pk_first.name end
end
for i=1, (PerfKit.Near.on and 0 or #player.deployedTroops), 1 do
  if(player.deployedTroops[i].id ~= soldier.id and player.deployedTroops[i].faction == soldier.faction and player.deployedTroops[i].health > 10) then
'''
match_indent = true

# convertedId finds a soldier's place in the list by walking it. The place is remembered
# from the sorting and checked before it is used; if it does not hold, the walk below runs.
[[patches]]
[patches.pattern]
id = "perfkit:near_converted_id"
name = "convertedId: look the soldier's place up"
target = "includes/urb_engine.lua"
pattern = "function convertedId(idzz)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then
    local __pk_i = PerfKit.Near.indexOf(idzz)
    if __pk_i then
      returnId = __pk_i
      return __pk_i
    end
  end
'''

# propagandaGathering walks every decal looking for a pamphlet, for every soldier that
# thinks. With no pamphlet on the map there is nothing to walk for.
[[patches]]
[patches.pattern]
id = "perfkit:near_propaganda"
name = "propagandaGathering: skip when no pamphlet is on the map"
target = "includes/urb_engine.lua"
pattern = "function propagandaGathering(dude)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on and not PerfKit.Near.decalNamed("pamphletSmall") then return end
'''

# --- The AI's whole-army walks ---------------------------------------------------------

# A machine gunner's target search writes a debug line for every enemy it passes over.
# The game only prints it for one soldier, by name, but the text was put together, with a
# distance worked out again, for every enemy on the map each time a gunner looked.
[[patches]]
[patches.pattern]
id = "perfkit:gunner_debug_within"
name = "soldierAI: gunner debug text only when it is printed (within range)"
target = "includes/ai.lua"
pattern = 'ltDebug(soldier, "gunner debug: enemy within range ("..distanceCheck(soldier.x, soldier.y, player.deployedTroops[u].x, player.deployedTroops[u].y) ..") but not closer than current target ("..soldier.targetDistance ..")")'
position = "at"
times = 1
payload = 'if soldier.name == "the new 2lt" then ltDebug(soldier, "gunner debug: enemy within range ("..distanceCheck(soldier.x, soldier.y, player.deployedTroops[u].x, player.deployedTroops[u].y) ..") but not closer than current target ("..soldier.targetDistance ..")") end'
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:gunner_debug_beyond"
name = "soldierAI: gunner debug text only when it is printed (beyond range)"
target = "includes/ai.lua"
pattern = 'ltDebug(soldier, "gunner debug: enemy beyond range ("..distanceCheck(soldier.x, soldier.y, player.deployedTroops[u].x, player.deployedTroops[u].y) ..")")'
position = "at"
times = 1
payload = 'if soldier.name == "the new 2lt" then ltDebug(soldier, "gunner debug: enemy beyond range ("..distanceCheck(soldier.x, soldier.y, player.deployedTroops[u].x, player.deployedTroops[u].y) ..")") end'
match_indent = true

# Before every shot the game counts the holders of one award by walking every soldier's
# awards.
[[patches]]
[patches.pattern]
id = "perfkit:near_original_six"
name = "numberOfOGs: count once per frame"
target = "includes/urb_engine.lua"
pattern = "function numberOfOGs()"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then return PerfKit.Near.originals() end
'''

# The front line is asked for many times a frame, in places once per soldier looked at.
# If no flagged Allied soldier is found the game's own walk below runs.
[[patches]]
[patches.pattern]
id = "perfkit:near_allied_front"
name = "alliedFrontLine: read the front from the sorting"
target = "includes/urb_engine.lua"
pattern = "function alliedFrontLine()"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then
    local __pk_front = PerfKit.Near.alliedFront()
    if __pk_front then return __pk_front end
  end
'''

[[patches]]
[patches.pattern]
id = "perfkit:near_closest_flagged"
name = "closestflaggedEnemy: try the nearest enemy first"
target = "includes/urb_engine.lua"
pattern = "function closestflaggedEnemy(dude)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then return PerfKit.Near.closestFlagged(dude) end
'''
