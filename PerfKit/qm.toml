[manifest]
version = "1.4.0"
priority = 10

[publish]
repository = "Gamiseus/MnB-Mods"
asset = "PerfKit.zip"

# --- Modules --------------------------------------------------------------

[[patches]]
[patches.module]
id = "perfkit:module_layer"
source = "perfkit_layer.lua"
before = "main.lua"
name = "includes/perfkit_layer"

[[patches]]
[patches.module]
id = "perfkit:module_decals"
source = "perfkit_decals.lua"
before = "main.lua"
name = "includes/perfkit_decals"

[[patches]]
[patches.module]
id = "perfkit:module_particles"
source = "perfkit_particles.lua"
before = "main.lua"
name = "includes/perfkit_particles"

[[patches]]
[patches.module]
id = "perfkit:module_atlas"
source = "perfkit_atlas.lua"
before = "main.lua"
name = "includes/perfkit_atlas"

[[patches]]
[patches.module]
id = "perfkit:module_timing"
source = "perfkit_timing.lua"
before = "main.lua"
name = "includes/perfkit_timing"

[[patches]]
[patches.module]
id = "perfkit:module_near"
source = "perfkit_near.lua"
before = "main.lua"
name = "includes/perfkit_near"

[[patches]]
[patches.module]
id = "perfkit:module_profiler"
source = "perfkit_profiler.lua"
before = "main.lua"
name = "includes/perfkit_profiler"

[[patches]]
[patches.module]
id = "perfkit:module_main"
source = "perfkit.lua"
before = "main.lua"
name = "includes/perfkit"

# The game's own files are loaded above this line, so PerfKit can wrap their functions.
[[patches]]
[patches.pattern]
id = "perfkit:require"
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = 'PerfKit = require "includes/perfkit"'
stack = "first"

# --- Drawing (includes/drawFiles.lua) --------------------------------------
# Each of the game's three loops is replaced by one call. With the option off, the call
# runs the game's own loop.

[[patches]]
[patches.pattern]
id = "perfkit:draw_decals"
name = "Decal loop"
target = "includes/drawFiles.lua"
pattern = '''
  for n=1, #player.deco, 1 do
    love.graphics.draw( _G[player.deco[n].name], player.deco[n].x, player.deco[n].y, player.deco[n].rotation, player.deco[n].size/10, player.deco[n].size/10, _G[player.deco[n].name]:getWidth( )/2, _G[player.deco[n].name]:getHeight( )/2)
  end
'''
position = "at"
times = 1
payload = '''
  PerfKit.drawDecals()
'''
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:draw_particles"
name = "Particle loop"
target = "includes/drawFiles.lua"
pattern = '''
  for i=1, #player.particles, 1 do
    love.graphics.setColor( love.math.colorFromBytes(255, 255, 255, player.particles[i].alpha))
    if player.particles[i].typez == "muzzleFlash" then
        -- pass 1: bright core
        love.graphics.setShader(muzzleFlashShader)
        love.graphics.setBlendMode("add")
        love.graphics.draw(
            _G[player.particles[i].sprite],
            player.particles[i].x, player.particles[i].y,
            player.particles[i].innerRotation,
            player.particles[i].scale, player.particles[i].scale,
            player.particles[i].xoffset, player.particles[i].yoffset - 20
        )
        love.graphics.setShader()

        -- pass 2 (optional): soft halo spill
        -- tie halo alpha to particle alpha so it dies quickly
        local a = player.particles[i].alpha
        love.graphics.setColor(255, 230, 160, math.min(180, a)) -- warm, softer alpha
        love.graphics.draw(
            _G[player.particles[i].sprite],
            player.particles[i].x, player.particles[i].y,
            player.particles[i].innerRotation,
            player.particles[i].scale * 1.1, player.particles[i].scale * 1.1,
            player.particles[i].xoffset, player.particles[i].yoffset - 20
        )

        love.graphics.setBlendMode("alpha") -- reset
    elseif(player.particles[i].typez == "bazookaFlash") then
      love.graphics.draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, (player.particles[i].innerRotation),player.particles[i].scale,player.particles[i].scale, player.particles[i].xoffset, player.particles[i].yoffset-20)
    elseif(player.particles[i].typez == "flarePart" or player.particles[i].typez == "redFlarePart") then
      if(randNbr(100)< 50) then
        local flareScale = randNbr(15)/10
        love.graphics. draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, math.rad(randNbr(360)), flareScale, flareScale, player.particles[i].xoffset, player.particles[i].yoffset)
      end
    else
      love.graphics.draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, (player.particles[i].innerRotation),player.particles[i].scale,player.particles[i].scale, player.particles[i].xoffset, player.particles[i].yoffset)
    end
  end
'''
position = "at"
times = 1
payload = '''
  PerfKit.drawParticles(player.particles, false)
'''
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:draw_top_particles"
name = "Top particle loop"
target = "includes/drawFiles.lua"
pattern = '''
  if(#player.topParticles > 0) then
    for i=1, #player.topParticles, 1 do
      love.graphics.setColor( love.math.colorFromBytes(255, 255, 255, player.topParticles[i].alpha))
      love.graphics.draw(_G[player.topParticles[i].sprite], player.topParticles[i].x, player.topParticles[i].y, (player.topParticles[i].innerRotation),player.topParticles[i].scale,player.topParticles[i].scale, player.topParticles[i].xoffset, player.topParticles[i].yoffset)
    end
  end
'''
position = "at"
times = 1
payload = '''
  PerfKit.drawParticles(player.topParticles, true)
'''
match_indent = true

# Once per frame: the overlay and the log watch.
[[patches]]
[patches.pattern]
id = "perfkit:frame"
target = "includes/drawFiles.lua"
pattern = "--cues"
position = "before"
times = 1
payload = '''
    PerfKit.frame()
'''
match_indent = true

# --- Game loops (includes/urb_engine.lua) ----------------------------------
# Same results as the game's own lines, computed with less work.

# The once-a-second fire update tested every decal's name with a pattern search, for every
# fire. The answer for a name is now looked up (PerfKit.roundKind).
[[patches]]
[patches.pattern]
id = "perfkit:fire_round_large"
name = "Fire update: large live rounds"
target = "includes/urb_engine.lua"
pattern = 'if string.match(deco.name, "liveRoundLarge") and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
position = "at"
times = 1
payload = 'if PerfKit.roundKind[deco.name] == "Large" and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:fire_round_med"
name = "Fire update: medium live rounds"
target = "includes/urb_engine.lua"
pattern = 'elseif string.match(deco.name, "liveRoundMed") and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
position = "at"
times = 1
payload = 'elseif PerfKit.roundKind[deco.name] == "Med" and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:fire_round_small"
name = "Fire update: small live rounds"
target = "includes/urb_engine.lua"
pattern = 'elseif string.match(deco.name, "liveRoundSmall") and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
position = "at"
times = 1
payload = 'elseif PerfKit.roundKind[deco.name] == "Small" and distanceCheck(deco.x, deco.y, firez.x, firez.y) < firez.size * 150 then'
match_indent = true

# slowedDown() asked "does this soldier have the tactical buff?" once per ground area, with
# the same answer every time. It now asks once per call.
[[patches]]
[patches.pattern]
id = "perfkit:slowed_once"
name = "slowedDown: look up the tactical buff once"
target = "includes/urb_engine.lua"
pattern = "function slowedDown(dude)"
position = "after"
times = 1
payload = '''
  local __pk_tactical = dude ~= nil and hasBuffByTag("tactical", dude)
'''

[[patches]]
[patches.pattern]
id = "perfkit:slowed_use"
name = "slowedDown: use the answer"
requires = ["perfkit:slowed_once"]
target = "includes/urb_engine.lua"
pattern = 'if(hasBuffByTag("tactical", dude)) then'
position = "at"
times = 1
payload = 'if(__pk_tactical) then'
match_indent = true

# --- Particle removal (includes/particlesSystem.lua) -------------------------
# The game removes an expired particle with table.remove, moving every particle behind it.
# PerfKit.Particles.kill marks it instead; the marked ones leave together when the update
# returns. Called from anywhere else, kill() is the game's own removal.

[[patches]]
[patches.pattern]
id = "perfkit:particle_kill"
name = "Particle update: remove expired particles in one pass"
target = "includes/particlesSystem.lua"
pattern = "table.remove(player.particles, i)"
position = "at"
times = 16
payload = "PerfKit.Particles.kill(player.particles, i, ticle)"
match_indent = true

[[patches]]
[patches.pattern]
id = "perfkit:top_particle_kill"
name = "Top particle update: remove expired particles in one pass"
target = "includes/particlesSystem.lua"
pattern = "table.remove(player.topParticles, i)"
position = "at"
times = 1
payload = "PerfKit.Particles.kill(player.topParticles, i, ticle)"
match_indent = true

# --- Ground area scans (includes/urb_engine.lua) -----------------------------
# The game keeps trees, cover, water and buildings in one list (player.groundType) and
# walks all of it for many questions. These patches ask the cheap part of each question
# first, so the distance is only worked out for an area that could matter.

# getOccupantBuildingId and insideBuilding: only a concrete or wood area with the right
# cover value counts as a building; that is now checked before the distance.
[[patches]]
[patches.pattern]
id = "perfkit:building_kind_first"
name = "Building checks: look at the kind of area before the distance"
target = "includes/urb_engine.lua"
pattern = "if(distanceCheck2(dude, player.groundType[u] ) < player.groundType[u].radius) then"
position = "at"
times = 2
payload = 'if((player.groundType[u].name == "concrete" and (player.groundType[u].cover == 75 or player.groundType[u].cover == 50) or player.groundType[u].name == "wood" and (player.groundType[u].cover == 50)) and distanceCheck2(dude, player.groundType[u] ) < player.groundType[u].radius) then'
match_indent = true

# slowedDown: only an area marked slow can slow a soldier; checked before the distance.
[[patches]]
[patches.pattern]
id = "perfkit:slowed_kind_first"
name = "slowedDown: look at the kind of area before the distance"
target = "includes/urb_engine.lua"
pattern = '''
if(distanceCheck2(dude, player.groundType[u]) < player.groundType[u].radius) then
  if(player.groundType[u].slowy == "yes") then
'''
position = "at"
times = 1
payload = '''
if(player.groundType[u].slowy == "yes" and distanceCheck2(dude, player.groundType[u]) < player.groundType[u].radius) then
  if(player.groundType[u].slowy == "yes") then
'''
match_indent = true

# exploDamageCheck asked "are the soldier and the explosion in the same building?" up to
# three times per soldier, walking the whole list twice each time. It now asks once.
[[patches]]
[patches.pattern]
id = "perfkit:explosion_same_building_once"
name = "Explosion damage: ask once whether soldier and explosion share a building"
target = "includes/urb_engine.lua"
pattern = '''
if((sameBuilding(dude, explo) ==  false and blastSave(dude, explo) == false) or
  (sameBuilding(dude, explo) ==  true and coveredBuilding(dude) == false)or
  (sameBuilding(dude, explo) ==  true and coveredBuilding(dude) == true and (explo.tag == "mineExplosion" or explo.tag == "rifleGrenadeExplosion"))) then
'''
position = "at"
times = 1
payload = '''
local __pk_same = sameBuilding(dude, explo)
if((__pk_same ==  false and blastSave(dude, explo) == false) or
  (__pk_same ==  true and coveredBuilding(dude) == false)or
  (__pk_same ==  true and coveredBuilding(dude) == true and (explo.tag == "mineExplosion" or explo.tag == "rifleGrenadeExplosion"))) then
'''
match_indent = true

# --- Enemies near a soldier (includes/urb_engine.lua) ------------------------
# These three count the soldiers of another faction within a distance by walking every
# soldier on the map. With the option on they ask PerfKit.Near, which looks only at the
# soldiers sorted into the columns within reach. With it off the game's loop below runs.

[[patches]]
[patches.pattern]
id = "perfkit:near_enemy_nearby"
name = "enemyNearby: count from the per-frame sorting"
target = "includes/urb_engine.lua"
pattern = "function enemyNearby(dude)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then return PerfKit.Near.count(dude, 600) end
'''

[[patches]]
[patches.pattern]
id = "perfkit:near_friendlies_close"
name = "friendliesCloseToTarget: count from the per-frame sorting"
target = "includes/urb_engine.lua"
pattern = "function friendliesCloseToTarget(target)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then return PerfKit.Near.count(target, 30) end
'''

[[patches]]
[patches.pattern]
id = "perfkit:near_enemy_cqc"
name = "enemyCqc: count from the per-frame sorting"
target = "includes/urb_engine.lua"
pattern = "function enemyCqc(dude)"
position = "after"
times = 1
payload = '''
  if PerfKit.Near.on then return PerfKit.Near.count(dude, 30, PerfKit.Near.reveal) end
'''

# --- Explosions (includes/urb_engine.lua) ------------------------------------
# Every explosion runs exploDamageCheck for every soldier on the map.

# sameBuilding: the second one asked about is the explosion. Its building is worked out
# once and remembered; when it is in no building the answer is "no" without looking the
# soldier up at all.
[[patches]]
[patches.pattern]
id = "perfkit:same_building_explosion_first"
name = "sameBuilding: the explosion's building first, and remembered"
target = "includes/urb_engine.lua"
pattern = '''
local dude1Building = getOccupantBuildingId(dude1)
local dude2Building = getOccupantBuildingId(dude2)
'''
position = "at"
times = 1
payload = '''
local dude2Building = PerfKit.buildingOf(dude2)
if(dude2Building <= 0) then return false end
local dude1Building = getOccupantBuildingId(dude1)
'''
match_indent = true

# blastSave copied its sound for every soldier before knowing whether it would be played.
# The copy is now made when it is played. The random number is drawn at the same place.
[[patches]]
[patches.pattern]
id = "perfkit:blast_save_sound_later"
name = "blastSave: copy the cover-save sound only when it plays"
target = "includes/urb_engine.lua"
pattern = '''
clone_sfx2 = _G["exploCoverSave"..randNbr(15)]:clone()
clone_sfx2:setVolume(stepScale(dude))
'''
position = "at"
times = 1
payload = '''
clone_sfx2 = PerfKit.laterSound("exploCoverSave"..randNbr(15), dude)
'''
match_indent = true

