# 23. urb_engine.lua: Fix menu_backButton to return to pause screen from options and sub-options
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = '''
  local serialize = require 'includes/ser'
  tellLearn = 0
'''
position = "after"
payload = '''
  if menuPage == 16 or menuPage == 12 then
    menuPage = 8
    mouseOverText = ""
    contextualText = ""
    return
  end
  if menuPage == 8 then
    if _G.optionsOpenedFromPause then
      -- Synchronize modified options to disk so settings persist
      if safeLoadProfile then
        local p3 = safeLoadProfile('saveMNB3.lua')
        if p3 then
          p3.option_volume = player.option_volume
          p3.option_music = player.option_music
          p3.option_fps = player.option_fps
          p3.option_fullScreen = player.option_fullScreen
          p3.option_maxParticles = player.option_maxParticles
          p3.option_maxDecals = player.option_maxDecals
          p3.option_floatyText = player.option_floatyText
          p3.option_textCues = player.option_textCues
          p3.scrollSpeed = player.scrollSpeed
          p3.borderLess = player.borderLess
          p3.muzzleFlash = player.muzzleFlash
          love.filesystem.write('saveMNB3.lua', serialize(p3))
        end
        if player.gameType == 1 then
          local p2 = safeLoadProfile('saveMNB2.lua')
          if p2 then
            p2.option_volume = player.option_volume
            p2.option_music = player.option_music
            p2.option_fps = player.option_fps
            p2.option_fullScreen = player.option_fullScreen
            p2.option_maxParticles = player.option_maxParticles
            p2.option_maxDecals = player.option_maxDecals
            p2.option_floatyText = player.option_floatyText
            p2.option_textCues = player.option_textCues
            p2.scrollSpeed = player.scrollSpeed
            love.filesystem.write('saveMNB2.lua', serialize(p2))
          end
        end
      end
      -- Return cleanly to active paused game
      player.gameState = 0
      menuPage = 0
      pause = 1
      _G.optionsOpenedFromPause = false
      _G.optionsPauseSavedPlayer = nil
      mouseOverText = ""
      contextualText = ""
      return
    else
      menuPage = 1
      mouseOverText = ""
      contextualText = ""
      return
    end
  end
'''
match_indent = true
