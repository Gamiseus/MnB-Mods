[manifest]
version = "1.0.0"
priority = 100

# Provide safe serializer module
[[patches]]
[patches.module]
source = "ser.lua"
before = "main.lua"
name = "includes/ser"

# 2. Provide Box2D physics LOS module
[[patches]]
[patches.module]
source = "los_physics.lua"
before = "main.lua"
name = "includes/los_physics"

# 2c. Provide Log Monitor module
[[patches]]
[patches.module]
source = "log_monitor.lua"
before = "main.lua"
name = "includes/log_monitor"

# 2e. Provide Decal Baker module
[[patches]]
[patches.module]
source = "decal_baker.lua"
before = "main.lua"
name = "includes/decal_baker"

# 3. Enable physics module in conf.lua (required by los_physics)
[[patches]]
[patches.pattern]
target = "conf.lua"
pattern = "t.modules.physics = false          -- Enable the physics module (boolean)"
position = "at"
payload = "t.modules.physics = true           -- Enable the physics module (boolean)"
match_indent = true

# 4. Enable thread module in conf.lua (required by log_monitor)
[[patches]]
[patches.pattern]
target = "conf.lua"
pattern = "t.modules.thread = false           -- Enable the thread module (boolean)"
position = "at"
payload = "t.modules.thread = true            -- Enable the thread module (boolean)"
match_indent = true

# 5. Require los_physics, log_monitor, and decal_baker in main.lua
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = '''
los_physics = require "includes/los_physics"
log_monitor = require "includes/log_monitor"
decal_baker = require "includes/decal_baker"
'''
match_indent = true

# 6. Initialize modules in love.load
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.load()"
position = "after"
payload = '''
  if los_physics then los_physics.init() end
  if log_monitor then log_monitor.init() end
  if decal_baker then decal_baker.init() end
'''
match_indent = true

# 7. Update los_physics frame in love.update
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "if(pause == 0) then"
position = "after"
payload = '''
        if los_physics then los_physics.updateFrame() end
        if log_monitor then log_monitor.update(dt) end
        if decal_baker then decal_baker.update(dt) end
'''
match_indent = true

# 10. Wrap los() in urb_engine.lua to use physics raycast
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = "function los(x1, x2, y1, y2)"
position = "at"
payload = '''
function los(x1, x2, y1, y2)
  if los_physics then
    return los_physics.checkLOS(x1, x2, y1, y2)
  end
  return vanilla_los(x1, x2, y1, y2)
end

function vanilla_los(x1, x2, y1, y2)
'''
match_indent = true

# 11. Wrap los2() in urb_engine.lua to use physics raycast
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = "function los2(shooter, target)"
position = "at"
payload = '''
function los2(shooter, target)
  if los_physics then
    return los_physics.checkLOS2(shooter, target)
  end
  return vanilla_los2(shooter, target)
end

function vanilla_los2(shooter, target)
'''
match_indent = true

# 15. Draw physics LOS debug overlay in drawFiles.lua
[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = "--cues"
position = "before"
payload = '''
    if los_physics then
      los_physics.drawDebugOverlay()
    end
'''
match_indent = true

# 16. Keybind for dedicated F10 LOS overlay toggle
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''
  if(key == "f4") then
    --trenchDebug()
'''
position = "before"
payload = '''
  if(key == "f10") then
    if los_physics then
      los_physics.debugOverlay = not los_physics.debugOverlay
      local isOn = los_physics.debugOverlay
      player.textCue[#player.textCue+1] = {}
      player.textCue[#player.textCue].name = isOn and "LOS Vision Overlay ON" or "LOS Vision Overlay OFF"
      player.textCue[#player.textCue].x = player.screenx + 600
      player.textCue[#player.textCue].y = 300
      player.textCue[#player.textCue].alpha = 255
      local sfx = isOn and gageUp or gageDown
      if sfx then local cl = sfx:clone(); cl:play() end
    end
  end
'''
match_indent = true

# 17. Inject Ctrl+F9 Tactical LOS benchmark
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = 'if(key == "f9") then'
position = "before"
payload = '''
  if key == "f9" and (love.keyboard.isDown("lctrl") or love.keyboard.isDown("rctrl")) then
    if los_physics and los_physics.runBenchmark then
      local bMs, vMs, spd = los_physics.runBenchmark(vanilla_los, 2000)
      player.textCue[#player.textCue+1] = {}
      player.textCue[#player.textCue].name = string.format("LOS Bench: %.1fms vs %.1fms (%.1fx)", bMs, vMs, spd)
      player.textCue[#player.textCue].x = player.screenx + 600
      player.textCue[#player.textCue].y = 260
      player.textCue[#player.textCue].alpha = 255
    end
  end
'''
match_indent = true


# 37. drawFiles.lua: High-performance Decal Canvas rendering
[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = '''
  for n=1, #player.deco, 1 do
    love.graphics.draw( _G[player.deco[n].name], player.deco[n].x, player.deco[n].y, player.deco[n].rotation, player.deco[n].size/10, player.deco[n].size/10, _G[player.deco[n].name]:getWidth( )/2, _G[player.deco[n].name]:getHeight( )/2)
  end
'''
position = "at"
payload = '''
  if decal_baker then
    decal_baker.draw()
  else
    for n=1, #player.deco, 1 do
      love.graphics.draw( _G[player.deco[n].name], player.deco[n].x, player.deco[n].y, player.deco[n].rotation, player.deco[n].size/10, player.deco[n].size/10, _G[player.deco[n].name]:getWidth( )/2, _G[player.deco[n].name]:getHeight( )/2)
    end
  end
'''
match_indent = true

# 40. urb_engine.lua: Notify Decal Baker immediately upon broom cleaning
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = '''
function broomerButton()
  player.broomTimer = 30
'''
position = "at"
payload = '''
function broomerButton()
  player.broomTimer = 30
  if decal_baker then decal_baker.on_broom_cleaned() end
'''
match_indent = true

# 41. urb_engine.lua: Clean excess decals immediately when adjusting MAX DECALS setting
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = '''
function op_decal1Button()
  player.option_maxDecals = 1
end
function op_decal2Button()
  player.option_maxDecals = 2
end
function op_decal3Button()
  player.option_maxDecals = 3
end
function op_decal4Button()
  player.option_maxDecals = 4
end
function op_decal5Button()
  player.option_maxDecals = 5
end
'''
position = "at"
payload = '''
function op_decal1Button()
  player.option_maxDecals = 1
  if decal_baker then decal_baker.clean_excess() end
end
function op_decal2Button()
  player.option_maxDecals = 2
  if decal_baker then decal_baker.clean_excess() end
end
function op_decal3Button()
  player.option_maxDecals = 3
  if decal_baker then decal_baker.clean_excess() end
end
function op_decal4Button()
  player.option_maxDecals = 4
  if decal_baker then decal_baker.clean_excess() end
end
function op_decal5Button()
  player.option_maxDecals = 5
  if decal_baker then decal_baker.clean_excess() end
end
'''
match_indent = true


