# Replace un-culled particle drawing with frustum culling, color caching, and null safety
[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = '''
  for i=1, #player.particles, 1 do
    love.graphics.setColor( love.math.colorFromBytes(255, 255, 255, player.particles[i].alpha)) 
    if player.particles[i].typez == "muzzleFlash" then
        -- pass 1: bright core
        love.graphics.setShader(muzzleFlashShader)
        love.graphics.setBlendMode("add")
        love.graphics.draw(
            _G[player.particles[i].sprite],
            player.particles[i].x, player.particles[i].y,
            player.particles[i].innerRotation,
            player.particles[i].scale, player.particles[i].scale,
            player.particles[i].xoffset, player.particles[i].yoffset - 20
        )
        love.graphics.setShader()

        -- pass 2 (optional): soft halo spill
        -- tie halo alpha to particle alpha so it dies quickly
        local a = player.particles[i].alpha
        love.graphics.setColor(255, 230, 160, math.min(180, a)) -- warm, softer alpha
        love.graphics.draw(
            _G[player.particles[i].sprite],
            player.particles[i].x, player.particles[i].y,
            player.particles[i].innerRotation,
            player.particles[i].scale * 1.1, player.particles[i].scale * 1.1,
            player.particles[i].xoffset, player.particles[i].yoffset - 20
        )

        love.graphics.setBlendMode("alpha") -- reset
    elseif(player.particles[i].typez == "bazookaFlash") then
      love.graphics.draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, (player.particles[i].innerRotation),player.particles[i].scale,player.particles[i].scale, player.particles[i].xoffset, player.particles[i].yoffset-20)
    elseif(player.particles[i].typez == "flarePart" or player.particles[i].typez == "redFlarePart") then
      if(randNbr(100)< 50) then
        local flareScale = randNbr(15)/10
        love.graphics. draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, math.rad(randNbr(360)), flareScale, flareScale, player.particles[i].xoffset, player.particles[i].yoffset)
      end
    else
      love.graphics.draw(_G[player.particles[i].sprite], player.particles[i].x, player.particles[i].y, (player.particles[i].innerRotation),player.particles[i].scale,player.particles[i].scale, player.particles[i].xoffset, player.particles[i].yoffset)
    end
  end
'''
