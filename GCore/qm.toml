# =========================================================================
# KEYBINDS & DEBUG OVERLAYS (main.lua)
# =========================================================================

# Dedicated F10 Keybind:
# - Shift+F10 : Sustained Continuous Benchmark (Vanilla vs Modded over time)
# - Alt+F10   : Particle System Solo Bench
# - Ctrl+F10  : Decal Baker Solo Bench
# - F10       : Toggle LOS Vision Overlay
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = '''
  if(key == "f4") then
    --trenchDebug()
'''
position = "before"
payload = '''
  if(key == "f10") then
    local ctrlDown = love.keyboard.isDown("lctrl") or love.keyboard.isDown("rctrl")
    local altDown = love.keyboard.isDown("lalt") or love.keyboard.isDown("ralt")
    local shiftDown = love.keyboard.isDown("lshift") or love.keyboard.isDown("rshift")

    if shiftDown then
      if runContinuousBenchmark then
        -- Runs for 3.0s vanilla, then 3.0s modded with 50,000 particles, 800,000 decals, 10,000 LOS rays
        local res = runContinuousBenchmark(10.0, 50000, 8000000, 10000, vanilla_los)
        if player and player.textCue and res then
          local baseY = 160
          local cues = {
            string.format("SUSTAINED BENCH (%.0fs each): %.1f FPS vs %.1f FPS (%.1fx Throughput)", res.duration, res.optFps, res.vFps, res.throughputSpeedup),
            string.format(" - Avg Frame: %.2fms vs %.2fms | Calls: %d->%d", res.optAvgMs, res.vAvgMs, res.vCalls, res.optCalls),
            string.format(" - Particles (%d): %.2fms vs %.2fms (%.1fx)", res.particleCount, res.optPartMs, res.vPartMs, res.partSpeedup),
            string.format(" - Decals (%d): %.2fms vs %.2fms (%.1fx) [Bake: %.1fms]", res.decalCount, res.optDecalMs, res.vDecalMs, res.decalSpeedup, res.bakeMs),
            string.format(" - LOS Rays (%d): %.2fms vs %.2fms (%.1fx)", res.losCount, res.optLosMs, res.vLosMs, res.losSpeedup),
            string.format(" - Spikes: Modded [max %.1fms] vs Vanilla [max %.1fms]", res.optMaxMs, res.vMaxMs)
          }
          for i, txt in ipairs(cues) do
            local idx = #player.textCue + 1
            player.textCue[idx] = {}
            player.textCue[idx].name = txt
            player.textCue[idx].x = player.screenx + 500
            player.textCue[idx].y = baseY + ((i - 1) * 24)
            player.textCue[idx].alpha = 255
          end
        end
      end
    elseif altDown then
      if runParticleBenchmark then
        local oMs, vMs, spd, cPct, cnt, vCalls, oCalls = runParticleBenchmark(50000, 5)
        if player and player.textCue then
          player.textCue[#player.textCue+1] = {}
          player.textCue[#player.textCue].name = string.format("Particles (%d): %.2fms vs %.2fms (%.1fx) [Culled: %.0f%% | Calls: %d->%d]", cnt, oMs, vMs, spd, cPct, vCalls, oCalls)
          player.textCue[#player.textCue].x = player.screenx + 600
          player.textCue[#player.textCue].y = 200
          player.textCue[#player.textCue].alpha = 255
        end
      end
    elseif ctrlDown then
      if decal_baker and decal_baker.runBenchmark then
        local bMs, vMs, spd, bakeMs, cnt = decal_baker.runBenchmark(5000000)
        if player and player.textCue then
          player.textCue[#player.textCue+1] = {}
          player.textCue[#player.textCue].name = string.format("Decals (%d): %.2fms vs %.2fms (%.1fx) [Bake: %.1fms]", cnt, bMs, vMs, spd, bakeMs)
          player.textCue[#player.textCue].x = player.screenx + 600
          player.textCue[#player.textCue].y = 230
          player.textCue[#player.textCue].alpha = 255
        end
      end
    else
      if los_physics then
        los_physics.debugOverlay = not los_physics.debugOverlay
        local isOn = los_physics.debugOverlay
        player.textCue[#player.textCue+1] = {}
        player.textCue[#player.textCue].name = isOn and "LOS Vision Overlay ON" or "LOS Vision Overlay OFF"
        player.textCue[#player.textCue].x = player.screenx + 600
        player.textCue[#player.textCue].y = 300
        player.textCue[#player.textCue].alpha = 255
        local sfx = isOn and gageUp or gageDown
        if sfx then local cl = sfx:clone(); cl:play() end
      end
    end
  end
'''
match_indent = true

