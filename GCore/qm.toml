[manifest]
version = "1.0.0"
priority = 100

# =========================================================================
# MODULE REGISTRATIONS
# =========================================================================

[[patches]]
[patches.module]
source = "ser.lua"
before = "main.lua"
name = "includes/ser"

[[patches]]
[patches.module]
source = "los_physics.lua"
before = "main.lua"
name = "includes/los_physics"

[[patches]]
[patches.module]
source = "log_monitor.lua"
before = "main.lua"
name = "includes/log_monitor"

[[patches]]
[patches.module]
source = "decal_baker.lua"
before = "main.lua"
name = "includes/decal_baker"

[[patches]]
[patches.module]
source = "pathfinding.lua"
before = "main.lua"
name = "includes/pathfinding"


# =========================================================================
# ENGINE CONFIGURATION (conf.lua)
# =========================================================================

# Enable physics module
[[patches]]
[patches.pattern]
target = "conf.lua"
pattern = "t.modules.physics = false          -- Enable the physics module (boolean)"
position = "at"
payload = "t.modules.physics = true           -- Enable the physics module (boolean)"
match_indent = true

# Enable thread module
[[patches]]
[patches.pattern]
target = "conf.lua"
pattern = "t.modules.thread = false           -- Enable the thread module (boolean)"
position = "at"
payload = "t.modules.thread = true            -- Enable the thread module (boolean)"
match_indent = true

# =========================================================================
# APPLICATION LIFECYCLE & SETTINGS (main.lua)
# =========================================================================

# Module initialization & modSettings definition
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = 'require "includes/directives"'
position = "after"
payload = '''
los_physics = require "includes/los_physics"
log_monitor = require "includes/log_monitor"
decal_baker = require "includes/decal_baker"
pathfinding = require "includes/pathfinding"

modSettings = {
  pathfindingEnabled = 1,
  safeDestinationEnabled = 1
}

function loadModSettings()
  if love and love.filesystem and love.filesystem.getInfo and love.filesystem.getInfo("mod_settings.lua") then
    local ok, loaded = pcall(love.filesystem.load, "mod_settings.lua")
    if ok and type(loaded) == "function" then
      local ok2, data = pcall(loaded)
      if ok2 and type(data) == "table" then
        if data.pathfindingEnabled ~= nil then modSettings.pathfindingEnabled = data.pathfindingEnabled end
        if data.safeDestinationEnabled ~= nil then modSettings.safeDestinationEnabled = data.safeDestinationEnabled end
      end
    end
  end
  if player then
    player.option_pathfindingEnabled = modSettings.pathfindingEnabled
    player.option_safeDestinationEnabled = modSettings.safeDestinationEnabled
  end
end

function saveModSettings()
  if love and love.filesystem then
    local ser = require "includes/ser"
    love.filesystem.write("mod_settings.lua", ser(modSettings))
  end
  if player then
    player.option_pathfindingEnabled = modSettings.pathfindingEnabled
    player.option_safeDestinationEnabled = modSettings.safeDestinationEnabled
  end
end
'''
match_indent = true

# Load mod settings before setting volume
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "setOptionVolume()"
position = "before"
payload = "  loadModSettings()"
match_indent = true

# Initialize modules on load
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "function love.load()"
position = "after"
payload = '''
  if los_physics then los_physics.init() end
  if log_monitor then log_monitor.init() end
  if decal_baker then decal_baker.init() end
  if pathfinding then pathfinding.initThreadWorker() end
'''
match_indent = true

# Update modules per frame
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "if(pause == 0) then"
position = "after"
payload = '''
        if los_physics then los_physics.updateFrame() end
        if log_monitor then log_monitor.update(dt) end
        if decal_baker then decal_baker.update(dt) end
        if pathfinding then pathfinding.update(dt) end
'''
match_indent = true

