# Infantry steering and collision resolution
[[patches]]
[patches.pattern]
target = "includes/ai.lua"
pattern = '''
          if(randNbr(100)<30) then
           -- -- print("creajusting angle for "..player.deployedTroops[i].name)
            if(player.deployedTroops[i].targety) then 
              player.deployedTroops[i].rotation = math.atan2(player.deployedTroops[i].y -(player.deployedTroops[i].targety), player.deployedTroops[i].x-(player.deployedTroops[i].targetx)) + 1.5707
            else
              floatyText(player.deployedTroops[i], "debug:Invalid targety detected on this soldier. \n (reassigning)")
              player.deployedTroops[i].targetx = player.deployedTroops[i].x
              player.deployedTroops[i].targety = player.deployedTroops[i].y
            end
          end
          player.deployedTroops[i].x = player.deployedTroops[i].x - math.sin(player.deployedTroops[i].rotation) * currentSpeed * dt
          player.deployedTroops[i].y = player.deployedTroops[i].y + math.cos(player.deployedTroops[i].rotation) * currentSpeed * dt
'''
position = "at"
payload = '''
          local steerX = player.deployedTroops[i].targetx
          local steerY = player.deployedTroops[i].targety
          local snapTurn = false
          if(pathfinding ~= nil and player.deployedTroops[i].onFire == 0 and (player.landed == nil or player.landed == 1)) then
            steerX, steerY, snapTurn = pathfinding.getSteeringTarget(player.deployedTroops[i], dt)
          end
          if(snapTurn or randNbr(100)<30) then
           -- -- print("creajusting angle for "..player.deployedTroops[i].name)
            if(player.deployedTroops[i].targety and steerY and steerX) then 
              player.deployedTroops[i].rotation = math.atan2(player.deployedTroops[i].y -(steerY), player.deployedTroops[i].x-(steerX)) + 1.5707
            else
              floatyText(player.deployedTroops[i], "debug:Invalid targety detected on this soldier. \n (reassigning)")
              player.deployedTroops[i].targetx = player.deployedTroops[i].x
              player.deployedTroops[i].targety = player.deployedTroops[i].y
            end
          end
          local prevX = player.deployedTroops[i].x
          local prevY = player.deployedTroops[i].y
          local distToGoal = math.sqrt((player.deployedTroops[i].x - player.deployedTroops[i].targetx)^2 + (player.deployedTroops[i].y - player.deployedTroops[i].targety)^2)
          local step = currentSpeed * dt
          if (steerX == player.deployedTroops[i].targetx and steerY == player.deployedTroops[i].targety and distToGoal <= (step + 2.5)) then
            player.deployedTroops[i].x = player.deployedTroops[i].targetx
            player.deployedTroops[i].y = player.deployedTroops[i].targety
          else
            player.deployedTroops[i].x = player.deployedTroops[i].x - math.sin(player.deployedTroops[i].rotation) * step
            player.deployedTroops[i].y = player.deployedTroops[i].y + math.cos(player.deployedTroops[i].rotation) * step
          end
          if(pathfinding ~= nil and player.deployedTroops[i].onFire == 0 and (player.landed == nil or player.landed == 1)) then
            pathfinding.resolveObstacleCollision(player.deployedTroops[i], prevX, prevY)
          end
'''
