pattern = "player = love.filesystem.load('saveMNB3.lua')()"
position = "at"
payload = '''
    player = (safeLoadProfile and safeLoadProfile('saveMNB3.lua')) or love.filesystem.load('saveMNB3.lua')()
    if not player and love.filesystem.getInfo('backUp.lua') then
      print("[SafeLoad] saveMNB3 unreadable, falling back to backUp.lua")
      player = (safeLoadProfile and safeLoadProfile('backUp.lua')) or player
    end
'''
match_indent = true

# 9. Inject safeLoadProfile function into urb_engine.lua
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = "function distanceCheck(myX, myY, yourX, yourY)"
position = "before"
payload = '''
function safeLoadProfile(filename)
  if not love or not love.filesystem then
    local f = io.open(filename, "r")
    if not f then return nil end
    local src = f:read("*a")
    f:close()
    local chunk, err = (loadstring or load)(src)
    if not chunk then
      print("[SafeLoad] Syntax error in " .. tostring(filename) .. ": " .. tostring(err))
      return nil
    end
    local ok, res = pcall(chunk)
    if not ok or type(res) ~= "table" then
      print("[SafeLoad] Exec error in " .. tostring(filename) .. ": " .. tostring(res))
      return nil
    end
    return res
  end

  if not love.filesystem.getInfo(filename) then return nil end
  local chunk, err = love.filesystem.load(filename)
  if not chunk then
    print("[SafeLoad] Failed to compile " .. tostring(filename) .. ": " .. tostring(err))
    return nil
  end
  local ok, res = pcall(chunk)
  if not ok or type(res) ~= "table" then
    print("[SafeLoad] Failed to execute " .. tostring(filename) .. ": " .. tostring(res))
    return nil
  end
  return res
end
'''
match_indent = true

# 10. Wrap los() in urb_engine.lua to use physics raycast
[[patches]]
[patches.pattern]
target = "includes/urb_engine.lua"
pattern = "function los(x1, x2, y1, y2)"
position = "at"
payload = '''
function los(x1, x2, y1, y2)
  if los_physics then
    return los_physics.checkLOS(x1, x2, y1, y2)
  end
  return vanilla_los(x1, x2, y1, y2)
end

function vanilla_los(x1, x2, y1, y2)
'''
match_indent = true

