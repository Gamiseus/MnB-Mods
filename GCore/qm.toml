[[patches]]
[patches.pattern]
target = "includes/drawFiles.lua"
pattern = '''
  if(player.broomTimer <= 0 and player.gameType == 1) then
    love.graphics.draw(broomIcon, 1250+player.screenx, 75, 0, 0.9, 0.9,broomIcon:getWidth( )/2, broomIcon:getHeight( )/2)
  end
'''
position = "at"
payload = '''
