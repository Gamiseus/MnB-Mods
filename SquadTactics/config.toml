id = "squad_tactics"
name = "Squad Tactics"

[[options]]
id = "squad_limit"
label = "Squad Size Limit"
type = "cycle"
options = [6, 8, 10, 12, 16, 24, 32, "OFF"]
labels = ["6", "8", "10", "12", "16", "24", "32", "OFF"]
default = 6
description = "Exposed soldier threshold before German counter-assault waves trigger (Default: 6)"

[[options]]
id = "smart_move"
label = "Smart Squad Move"
type = "checkbox"
default = true
description = "Weighted cover distribution, overwatch spacing, and medic placement on squad move orders"

[[options]]
id = "combat_reactions"
label = "React To Contact"
type = "checkbox"
default = true
description = "Soldiers on a move order stop to return fire or run for cover when they meet the enemy, then carry on"
